<div class="alert alert-danger" *ngIf="errors">{{errors.error.error}}</div>

<form #regForm="ngForm" (ngSubmit)="onSubmit(regForm.value)">
  <div class="form-group row">
    <div class="col-sm-2">Datum:</div>
    <div class="col-sm-10"><input [(ngModel)]="respdata.date" name="date" type="date" readonly class="form-control"></div>
  </div>
  <div class="form-group row">
    <div class="col-sm-2">Start:</div>
    <div class="col-sm-10">
      <input [(ngModel)]="respdata.start" type="time" readonly class="form-control" name="start">
    </div>
  </div>
  <div class="form-group row">
    <div class="col-sm-2">Einde:</div>
    <div class="col-sm-10">
      <input [(ngModel)]="curTime" type="time" class="form-control" name="end">
    </div>
  </div>
  <div class="form-group row">
    <div class="col-sm-2">Gewerkte tijd:</div>
    <div class="col-sm-10"><countup-timer [countUpTimerConfig]="testConfig"></countup-timer></div>
  </div>
  <button type="submit" class="btn btn-block btn-lg btn-danger"><fa-icon [icon]="faStop"></fa-icon> Stop</button>
</form>
