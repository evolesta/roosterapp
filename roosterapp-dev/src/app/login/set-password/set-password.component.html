<nav class="navbar navbar-dark bg-dark">
  <span class="navbar-brand mb-0 h1">RoosterApp V2</span>
</nav>

<div class="container">
  <h1 class="display-4">Nieuw wachtwoord instellen</h1>

  <p>Maak nu een nieuw wachtwoord aan voor je account.</p>

  <div *ngIf="message" class="alert alert-success">
    {{message}}
  </div>

  <div *ngIf="errors" class="alert alert-danger">
    Er zijn fouten opgetreden.
    <p *ngIf="errors.error">{{errors?.error}}</p>
  </div>

  <form #setPassword="ngForm" (ngSubmit)="sendForm(setPassword.value)">
    <div class="form-group">
      <label for="password1">Nieuw wachtwoord:</label>
      <input type="password" name="wachtwoord1" id="password1" class="form-control" [ngClass]="{ 'is-invalid': errors?.wachtwoord1 }" ngModel>
      <div *ngIf="errors?.wachtwoord1" class="invalid-feedback">
        <li *ngFor="let error of errors.wachtwoord1">{{error}}</li>
      </div>
    </div>
    <div class="form-group">
      <label for="password2">Nieuw wachtwoord herhalen:</label>
      <input type="password" name="wachtwoord2" id="password2" class="form-control" [ngClass]="{ 'is-invalid': errors?.wachtwoord2 }" ngModel>
      <div *ngIf="errors?.wachtwoord2" class="invalid-feedback">
        <li *ngFor="let error of errors.wachtwoord2">{{error}}</li>
      </div>
    </div>
    <button type="submit" class="btn btn-lg btn-block btn-primary"><fa-icon [icon]="faSave"></fa-icon> Opslaan</button>
  </form>
</div>
