<nav class="navbar navbar-dark bg-dark">
  <span class="navbar-brand mb-0 h1">RoosterApp V2</span>
</nav>

<div class="container">
  <h1 class="display-4">Wachtwoord vergeten</h1>

  <p>Ben je jouw wachtwoord vergeten? Vul dan hieronder je gebruikersnaam en e-mail adres in om een nieuw wachtwoord in te stellen.</p>

  <div *ngIf="errors" class="alert alert-danger">
    Er is een probleem opgetreden.
    <p *ngIf="errors.error">{{errors.error}}</p>
  </div>

  <div *ngIf="message" class="alert alert-success">
    {{message}}
  </div>

  <form #resetPassword="ngForm" (ngSubmit)="sendForm(resetPassword.value)">
    <div class="form-group">
      <label for="username">Gebruikersnaam</label>
      <input type="text" name="gebruikersnaam" id="username" class="form-control" [ngClass]="{ 'is-invalid': errors?.gebruikersnaam }" ngModel>
      <div *ngIf="errors?.gebruikersnaam" class="invalid-feedback">
        <li *ngFor="let error of errors.gebruikersnaam">{{error}}</li>
      </div>
    </div>
    <div class="form-group">
      <label for="email">E-mail adres</label>
      <input type="email" name="emailadres" id="email" class="form-control" [ngClass]="{ 'is-invalid': errors?.emailadres }" ngModel>
      <div *ngIf="errors?.emailadres" class="invalid-feedback">
        <li *ngFor="let error of errors.emailadres">{{error}}</li>
      </div>
    </div>
    <button type="submit" class="btn btn-lg btn-block btn-primary"><fa-icon [icon]="faEnvelope"></fa-icon> Wachtwoord resetten</button>
  </form>
</div>
