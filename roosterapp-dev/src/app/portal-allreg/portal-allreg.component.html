<form>
  <div class="form-group row">
    <label for="date" class="col-sm-2 col-form-label"><fa-icon [icon]="calendar"></fa-icon> Datum</label>
    <div class="col-sm-10">
      <input type="date" readonly class="form-control-plaintext" id="date" value="{{respdata.date}}">
    </div>
  </div>
  <div class="form-group row">
    <label for="start" class="col-sm-2 col-form-label"><fa-icon [icon]="start"></fa-icon> Start</label>
    <div class="col-sm-10">
      <input type="time" readonly class="form-control" id="start" value="{{respdata.start}}">
    </div>
  </div>
  <div class="form-group row">
    <label for="end" class="col-sm-2 col-form-label"><fa-icon [icon]="stop"></fa-icon> Einde</label>
    <div class="col-sm-10">
      <input type="time" readonly class="form-control" id="end" value="{{respdata.end}}">
    </div>
  </div>
</form>
