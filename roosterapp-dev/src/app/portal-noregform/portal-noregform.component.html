<div class="alert alert-danger" *ngIf="errors">
  <li *ngFor="let error of errors">{{error}}</li>
</div>

<form #regForm="ngForm" (ngSubmit)="onSubmit(regForm.value)">
  <div class="form-group row">
    <div class="col-sm-2">Datum:</div>
    <div class="col-sm-10"><input type="date" class="form-control-plaintext" readonly name="date" [(ngModel)]="curDate"></div>
  </div>
  <div class="form-group row">
    <div class="col-sm-2">Start:</div>
    <div class="col-sm-10">
      <input type="time" class="form-control" name="start" value="{{curTime}}" [(ngModel)]="curTime">
    </div>
  </div>
  <div class="form-group row">
    <div class="col-sm-2">Einde:</div>
    <div class="col-sm-10">
      <input type="time" class="form-control" name="end" readonly>
    </div>
  </div>
  <button type="submit" class="btn btn-block btn-lg btn-success"><fa-icon [icon]="faPlay"></fa-icon> Start</button>
</form>
