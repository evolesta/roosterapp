<app-header></app-header>

<div class="container">
  <h1 class="display-4">Manager portaal</h1>

  <div class="icon"><fa-icon [icon]="faUserTie"></fa-icon></div>

  <p><b>Manager van team(s):</b>
  <li *ngFor="let team of teams">{{team.name}}</li>
  </p>

  <p><b>Registraties per gebruiker</b></p>
  <table class="table table-hover table-light table-sm">
    <thead>
    <tr>
      <th>Naam</th>
      <th>Team</th>
      <th>Te werken uren per dag</th>
      <th>Totaal gewerkt</th>
      <th>Saldo</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let teamMember of teamMembers">
      <td>{{teamMember.name}}</td>
      <td>{{teamMember.team_name}}</td>
      <td>{{teamMember.workhours}} uren</td>
      <td>{{teamMember.workedHours}}</td>
      <td>{{teamMember.saldo}}</td>
    </tr>
    </tbody>
  </table>
</div>

<app-footer></app-footer>
